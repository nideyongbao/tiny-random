name: Build and deploy tiny-random architecture atlas

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'site/**'
      - 'sources/**'
      - 'scripts/**'
      - 'dist/**'
      - 'build_site.py'
      - 'check_trace.py'
      - '.github/workflows/pages.yaml'
  pull_request:
    paths:
      - 'catalog/**'
      - 'site/**'
      - 'sources/**'
      - 'scripts/**'
      - 'dist/**'
      - 'build_site.py'
      - 'check_trace.py'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build static pages from reviewed catalog
        run: python build_site.py
      - name: Validate links, sources, catalog and recorded trace
        run: |
          python scripts/check_site.py
          python check_trace.py
          node --check dist/assets/atlas.js
          node --check dist/replay.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
